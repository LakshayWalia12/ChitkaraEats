<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chitkara Eats Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .login-wrap {
            width: 850px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .brand {
            background: #800000;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .brand p {
            line-height: 1.6;
            color: #f1dede;
        }

        .points {
            margin-top: 30px;
            display: grid;
            gap: 12px;
        }

        .point {
            background: rgba(255, 255, 255, 0.12);
            padding: 12px;
            border-radius: 8px;
        }

        .form-area {
            padding: 40px;
        }

        .form-area h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .sub {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .field input:focus {
            border-color: #800000;
            box-shadow: 0 0 5px rgba(128, 0, 0, 0.2);
        }

        .password-box {
            display: flex;
            gap: 8px;
        }

        .password-box input {
            flex: 1;
            min-width: 0;
        }

        .show-btn {
            padding: 10px;
            border: 1px solid #800000;
            background: white;
            color: #800000;
            border-radius: 7px;
            cursor: pointer;
        }

        .show-btn:hover {
            background: #f8eeee;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #800000;
            color: white;
            padding: 13px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #600000;
        }

        .error {
            display: none;
            color: #b00020;
            background: #fff0f0;
            border: 1px solid #ffd0d0;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .success {
            display: none;
            color: #166534;
            background: #f0fff4;
            border: 1px solid #bbf7d0;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f8f8f8;
            border: 1px solid #eee;
            border-radius: 7px;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 650px) {
            .login-wrap {
                grid-template-columns: 1fr;
            }

            .brand {
                padding: 25px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .form-area {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrap">

        <div class="brand">

            <div class="logo">
                Chitkara Eats
            </div>

            <h1>Campus Food, Just Better</h1>

            <p>
                Login to enjoy delicious food and drinks
                on your campus.
            </p>

            <div class="points">

                <div class="point">
                    Fast Food Ordering
                </div>

                <div class="point">
                    Student Friendly
                </div>

                <div class="point">
                    Late Night Cravings
                </div>

            </div>

        </div>

        <div class="form-area">

            <h2>Student Login</h2>

            <p class="sub">
                Enter your details to continue
            </p>

            <div class="error" id="error"></div>

            <div class="success" id="success"></div>

            <form id="loginForm">

                <div class="field">

                    <label for="rollNo">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="rollNo"
                        placeholder="Enter Student ID"
                        required
                    >

                </div>

                <div class="field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>

                <div class="field">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        inputmode="numeric"
                        maxlength="10"
                        placeholder="Enter 10 digit phone number"
                        required
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            class="show-btn"
                            id="showBtn"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>

            <div class="demo">

                Student Login Portal

            </div>

        </div>

    </div>

    <script>

        

        function togglePassword() {

            const password =
                document.getElementById("password");

            const showBtn =
                document.getElementById("showBtn");

            if (password.type === "password") {

                password.type = "text";

                showBtn.textContent = "Hide";

            } else {

                password.type = "password";

                showBtn.textContent = "Show";

            }

        }


        

        document.getElementById("loginForm")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                const rollNo =
                    document.getElementById("rollNo").value.trim();

                const name =
                    document.getElementById("name").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const password =
                    document.getElementById("password").value;

                const error =
                    document.getElementById("error");

                const success =
                    document.getElementById("success");


                

                error.style.display = "none";

                success.style.display = "none";


                

                if (
                    rollNo === "" ||
                    name === "" ||
                    phone === "" ||
                    password === ""
                ) {

                    error.textContent =
                        "Please fill all fields";

                    error.style.display = "block";

                    return;

                }


                

                if (!/^[0-9]{10}$/.test(phone)) {

                    error.textContent =
                        "Enter a valid 10 digit phone number";

                    error.style.display = "block";

                    return;

                }


                

                if (password.length < 8) {

                    error.textContent =
                        "Password must be at least 8 characters";

                    error.style.display = "block";

                    return;

                }


                

                const student = {

                    rollNo: rollNo,

                    name: name,

                    phone: phone

                };


                sessionStorage.setItem(
                    "chitkaraEatsStudent",
                    JSON.stringify(student)
                );


                sessionStorage.setItem(
                    "chitkaraEatsLoggedIn",
                    "true"
                );


            

                success.textContent =
                    "Login successful! Welcome " + name;

                success.style.display = "block";


            });

    </script>

</body>

</html>
